<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bodega & Ropa - Scanner Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; }
        #scanner-view video { object-fit: cover !important; border-radius: 1rem; width: 100% !important; height: 100% !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-blue-600 text-white px-5 pt-12 pb-4 shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-lg font-black tracking-tight flex items-center gap-2">
                    <i class="fa-solid fa-store text-amber-300"></i> Mi Bodega & Ropa
                </h1>
                <p id="status-sync" class="text-[11px] text-blue-100 flex items-center gap-1.5">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span> Conectado a Sheets
                </p>
            </div>
            <button onclick="cargarInventarioDesdeSheets(true)" class="text-xs bg-blue-700 active:bg-blue-800 border border-blue-400/30 px-3 py-1.5 rounded-full flex items-center gap-1.5">
                <i id="sync-icon" class="fa-solid fa-arrows-rotate"></i>
                <span id="badge-total">0 prod.</span>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-md mx-auto w-full p-4 flex-1 pb-24">

        <!-- ================= TAB 1: VERIFICADOR / VENTA ================= -->
        <section id="tab-verificar" class="space-y-4">
            <button onclick="abrirCamara('verificar')" class="w-full bg-blue-600 active:bg-blue-700 text-white py-4 px-5 rounded-2xl shadow-lg shadow-blue-500/25 flex items-center justify-center gap-3 text-base font-bold">
                <i class="fa-solid fa-camera text-xl"></i> Escanear con Cámara
            </button>

            <!-- Búsqueda Manual -->
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex gap-2">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                    <input type="text" id="input-buscar-codigo" placeholder="Escribir código o nombre..." class="w-full pl-8 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
                </div>
                <button onclick="buscarPorCodigoManual()" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-semibold">
                    Buscar
                </button>
            </div>

            <!-- Ficha del Producto Encontrado -->
            <div id="card-producto" class="hidden bg-white p-5 rounded-2xl shadow-md border border-slate-200 space-y-4">
                <div class="flex gap-4 items-center border-b border-slate-100 pb-3">
                    <img id="card-img" src="" class="w-20 h-20 rounded-xl object-cover bg-slate-100 border border-slate-200 hidden" onerror="this.classList.add('hidden')">
                    <div class="flex-1 min-w-0">
                        <span id="card-categoria" class="text-[10px] font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md inline-block mb-1"></span>
                        <h2 id="card-nombre" class="text-lg font-black text-slate-800 leading-snug"></h2>
                        <span id="card-codigo" class="text-[11px] font-mono text-slate-400 block mt-0.5"></span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 text-center">
                    <div class="bg-emerald-50 border border-emerald-100 p-3 rounded-xl">
                        <span class="text-[10px] uppercase font-bold text-emerald-600 block">Precio Venta</span>
                        <span id="card-precio" class="text-2xl font-black text-emerald-700"></span>
                    </div>
                    <div class="bg-amber-50 border border-amber-100 p-3 rounded-xl">
                        <span class="text-[10px] uppercase font-bold text-amber-600 block">Stock en Tienda</span>
                        <span id="card-stock" class="text-2xl font-black text-amber-700"></span>
                    </div>
                </div>

                <div class="flex gap-2 pt-1">
                    <button id="btn-vender" onclick="venderUnidad()" class="flex-1 bg-emerald-600 active:bg-emerald-700 text-white py-3 rounded-xl font-bold text-sm shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cart-arrow-down"></i> Vender (-1)
                    </button>
                    <button onclick="cargarEnReposicion(productoSeleccionado)" class="bg-blue-50 active:bg-blue-100 text-blue-600 border border-blue-200 px-4 py-3 rounded-xl font-semibold text-sm">
                        <i class="fa-solid fa-truck-ramp-box"></i> +Stock
                    </button>
                </div>
            </div>

            <div id="card-vacio" class="text-center py-12 px-6">
                <div class="w-16 h-16 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                    <i class="fa-solid fa-barcode"></i>
                </div>
                <h3 class="font-bold text-slate-700 text-sm">Listo para escanear</h3>
                <p class="text-xs text-slate-400 mt-1 max-w-[240px] mx-auto">Apunta la cámara a cualquier producto de bodega o prenda de vestir.</p>
            </div>
        </section>

        <!-- ================= TAB 2: REPOSICIÓN RÁPIDA ================= -->
        <section id="tab-registro" class="space-y-4 hidden">
            <div id="box-reposicion" class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm space-y-4">
                <div class="border-b border-slate-100 pb-3">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-amber-600">Recepción de Mercadería</span>
                    <h3 id="repo-nombre" class="font-bold text-slate-800 text-base mt-0.5">Selecciona un producto</h3>
                    <p id="repo-stock-actual" class="text-xs text-slate-500 mt-0.5"></p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-2">Sumar paquetes / fardos:</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="sumarLote(1)" class="bg-slate-50 border border-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs active:bg-blue-50 active:border-blue-300">+1 un.</button>
                        <button onclick="sumarLote(6)" class="bg-slate-50 border border-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs active:bg-blue-50 active:border-blue-300">+6 (pack)</button>
                        <button onclick="sumarLote(12)" class="bg-slate-50 border border-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs active:bg-blue-50 active:border-blue-300">+12 (doc.)</button>
                        <button onclick="sumarLote(24)" class="bg-slate-50 border border-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs active:bg-blue-50 active:border-blue-300">+24 (fardo)</button>
                    </div>
                </div>

                <div class="flex gap-2 pt-2 border-t border-slate-100">
                    <input type="number" id="repo-manual" placeholder="Otra cant." class="w-28 p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-center font-bold">
                    <button onclick="sumarLote(parseInt(document.getElementById('repo-manual').value) || 0)" class="flex-1 bg-amber-600 active:bg-amber-700 text-white font-bold py-2.5 rounded-xl text-xs">
                        Sumar al Inventario
                    </button>
                </div>
            </div>
        </section>

        <!-- ================= TAB 3: INVENTARIO COMPLETO ================= -->
        <section id="tab-inventario" class="space-y-3 hidden">
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass text-slate-400 text-sm ml-2"></i>
                <input type="text" id="filtro-buscar" onkeyup="renderizarInventario()" placeholder="Filtrar por nombre o código..." class="w-full py-1 text-sm bg-transparent focus:outline-none">
            </div>

            <div id="lista-inventario" class="space-y-2"></div>
        </section>

    </main>

    <!-- Modal Cámara Escáner -->
    <div id="modal-scanner" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 hidden flex flex-col justify-between p-4">
        <div class="flex justify-between items-center text-white pt-6 px-2">
            <div>
                <h3 class="font-black text-base">Apunta al código</h3>
                <p class="text-xs text-slate-300">Enfoca el código de barras</p>
            </div>
            <button onclick="cerrarCamara()" class="w-10 h-10 bg-white/20 active:bg-white/30 rounded-full flex items-center justify-center text-white text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="w-full max-w-sm mx-auto my-auto relative">
            <div id="scanner-view" class="w-full aspect-square bg-slate-900 rounded-2xl overflow-hidden border border-white/20"></div>
            <div class="absolute inset-8 border-2 border-dashed border-amber-400/80 rounded-xl pointer-events-none flex items-center justify-center">
                <div class="w-full h-0.5 bg-red-500/70 shadow-lg shadow-red-500"></div>
            </div>
        </div>

        <div class="text-center text-white/60 text-xs pb-6">
            EAN-13, UPC, Code-128 y QR compatibles
        </div>
    </div>

    <!-- Navegación Inferior -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2 shadow-lg z-30">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <button onclick="cambiarTab('verificar')" id="btn-tab-verificar" class="flex flex-col items-center gap-1 text-blue-600 font-bold text-[11px] py-1">
                <i class="fa-solid fa-barcode text-lg"></i> Consultar / Vender
            </button>
            <button onclick="cambiarTab('registro')" id="btn-tab-registro" class="flex flex-col items-center gap-1 text-slate-400 font-medium text-[11px] py-1">
                <i class="fa-solid fa-truck-ramp-box text-lg"></i> Mercadería
            </button>
            <button onclick="cambiarTab('inventario')" id="btn-tab-inventario" class="flex flex-col items-center gap-1 text-slate-400 font-medium text-[11px] py-1">
                <i class="fa-solid fa-boxes-stacked text-lg"></i> Inventario
            </button>
        </div>
    </nav>

    <!-- Lógica de Conexión y Cámara -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxxYR9UR6hvRh8TVK_cpLKVlGR68fRS95F5LmcffYf4f49DU9xZkcAxZzyx1nab71a7/exec";

        let inventario = JSON.parse(localStorage.getItem('bodega_sheets_cache')) || {};
        let html5QrCode = null;
        let destinoEscaneo = 'verificar';
        let productoSeleccionado = null;

        function formatearUrlImagen(url) {
            if (!url) return null;
            if (url.includes("drive.google.com")) {
                const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w400`;
                }
            }
            return url;
        }

        async function cargarInventarioDesdeSheets(mostrarAlerta = false) {
            const icon = document.getElementById('sync-icon');
            icon.classList.add('fa-spin');

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                inventario = {};
                data.forEach(item => {
                    const cod = String(item['Código'] || item['Codigo'] || '').trim();
                    if (cod) {
                        inventario[cod] = {
                            codigo: cod,
                            categoria: item['Categoría'] || item['Categoria'] || 'General',
                            nombre: item['Producto'] || item['Nombre'] || 'Sin nombre',
                            precioCosto: parseFloat(item['Precio Costo (S/)'] || item['Precio Costo'] || 0),
                            precio: parseFloat(item['Precio Venta (S/)'] || item['Precio Venta'] || 0),
                            stock: parseInt(item['Stock Actual'] || item['Stock'] || 0),
                            stockMin: parseInt(item['Stock Mínimo'] || item['Stock Minimo'] || 0),
                            foto: formatearUrlImagen(item['Imagen URL'] || item['Imagen'] || '')
                        };
                    }
                });

                localStorage.setItem('bodega_sheets_cache', JSON.stringify(inventario));
                actualizarInsignia();
                if (mostrarAlerta) alert("¡Inventario actualizado desde Google Sheets!");
            } catch (err) {
                console.warn("Usando datos locales:", err);
                actualizarInsignia();
            } finally {
                icon.classList.remove('fa-spin');
            }
        }

        function actualizarInsignia() {
            document.getElementById('badge-total').innerText = `${Object.keys(inventario).length} prod.`;
        }

        function reproducirBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(1800, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
            if (navigator.vibrate) navigator.vibrate(60);
        }

        function cambiarTab(tab) {
            ['verificar', 'registro', 'inventario'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-tab-${t}`).className = "flex flex-col items-center gap-1 text-slate-400 font-medium text-[11px] py-1";
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-tab-${tab}`).className = "flex flex-col items-center gap-1 text-blue-600 font-bold text-[11px] py-1";

            if (tab === 'inventario') renderizarInventario();
        }

        async function abrirCamara(destino) {
            destinoEscaneo = destino;
            document.getElementById('modal-scanner').classList.remove('hidden');

            const config = {
                fps: 15,
                qrbox: { width: 260, height: 160 },
                aspectRatio: 1.0,
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E,
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.QR_CODE
                ]
            };

            try {
                if (html5QrCode) {
                    await html5QrCode.stop().catch(() => {});
                    html5QrCode = null;
                }
                html5QrCode = new Html5Qrcode("scanner-view");
                await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, () => {});
            } catch (err) {
                alert("Verifica los permisos de cámara en tu navegador.");
                cerrarCamara();
            }
        }

        async function cerrarCamara() {
            if (html5QrCode && html5QrCode.isScanning) {
                await html5QrCode.stop().catch(() => {});
                html5QrCode = null;
            }
            document.getElementById('modal-scanner').classList.add('hidden');
        }

        function onScanSuccess(codigo) {
            reproducirBeep();
            cerrarCamara();
            mostrarDetallesProducto(codigo);
        }

        function buscarPorCodigoManual() {
            const val = document.getElementById('input-buscar-codigo').value.trim();
            if (val) {
                let match = inventario[val];
                if (!match) {
                    match = Object.values(inventario).find(p => p.nombre.toLowerCase().includes(val.toLowerCase()));
                }
                if (match) mostrarDetallesProducto(match.codigo);
                else alert(`No se encontró "${val}" en el inventario.`);
            }
        }

        function mostrarDetallesProducto(codigo) {
            productoSeleccionado = codigo;
            const card = document.getElementById('card-producto');
            const placeholder = document.getElementById('card-vacio');

            if (inventario[codigo]) {
                const item = inventario[codigo];
                document.getElementById('card-codigo').innerText = `CÓDIGO: ${codigo}`;
                document.getElementById('card-categoria').innerText = item.categoria;
                document.getElementById('card-nombre').innerText = item.nombre;
                document.getElementById('card-precio').innerText = `S/ ${item.precio.toFixed(2)}`;
                document.getElementById('card-stock').innerText = item.stock;

                const imgEl = document.getElementById('card-img');
                if (item.foto) {
                    imgEl.src = item.foto;
                    imgEl.classList.remove('hidden');
                } else {
                    imgEl.classList.add('hidden');
                }

                card.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                card.classList.add('hidden');
                placeholder.classList.remove('hidden');
                alert(`El código "${codigo}" no existe en Google Sheets. Agrégalo primero en la hoja de cálculo.`);
            }
        }

        async function sincronizarCambioStock(codigo, delta) {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accion: "actualizarStock", codigo: codigo, delta: delta })
                });
            } catch (e) {
                console.error("Error al sincronizar con Sheets:", e);
            }
        }

        function venderUnidad() {
            if (productoSeleccionado && inventario[productoSeleccionado]) {
                if (inventario[productoSeleccionado].stock > 0) {
                    inventario[productoSeleccionado].stock -= 1;
                    localStorage.setItem('bodega_sheets_cache', JSON.stringify(inventario));
                    mostrarDetallesProducto(productoSeleccionado);
                    sincronizarCambioStock(productoSeleccionado, -1);
                } else {
                    alert("¡Sin stock disponible!");
                }
            }
        }

        function cargarEnReposicion(codigo) {
            if (!inventario[codigo]) return;
            productoSeleccionado = codigo;
            const item = inventario[codigo];
            document.getElementById('repo-nombre').innerText = item.nombre;
            document.getElementById('repo-stock-actual').innerText = `Stock actual: ${item.stock} unidades | S/ ${item.precio.toFixed(2)}`;
            cambiarTab('registro');
        }

        function sumarLote(cantidad) {
            if (productoSeleccionado && inventario[productoSeleccionado] && cantidad > 0) {
                inventario[productoSeleccionado].stock += cantidad;
                localStorage.setItem('bodega_sheets_cache', JSON.stringify(inventario));
                cargarEnReposicion(productoSeleccionado);
                sincronizarCambioStock(productoSeleccionado, cantidad);
                alert(`Se sumaron +${cantidad} unidades a ${inventario[productoSeleccionado].nombre}.`);
            }
        }

        function renderizarInventario() {
            const lista = document.getElementById('lista-inventario');
            const filtro = document.getElementById('filtro-buscar').value.toLowerCase();
            lista.innerHTML = '';

            const keys = Object.keys(inventario);
            if (keys.length === 0) {
                lista.innerHTML = `<p class="text-center text-xs text-slate-400 py-8">Inventario vacío. Pulsa el botón de actualizar arriba.</p>`;
                return;
            }

            keys.forEach(cod => {
                const item = inventario[cod];
                if (item.nombre.toLowerCase().includes(filtro) || cod.includes(filtro)) {
                    lista.innerHTML += `
                        <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center gap-3">
                            ${item.foto ? `<img src="${item.foto}" class="w-11 h-11 rounded-xl object-cover border border-slate-100" onerror="this.remove()">` : ''}
                            <div class="flex-1 min-w-0" onclick="mostrarDetallesProducto('${cod}'); cambiarTab('verificar')">
                                <h4 class="font-bold text-slate-800 text-sm truncate">${item.nombre}</h4>
                                <div class="flex items-center gap-2 mt-0.5">
                                    <span class="text-[10px] font-mono text-slate-400">${cod}</span>
                                    <span class="text-xs font-black text-emerald-600">S/ ${item.precio.toFixed(2)}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-black px-2.5 py-1 rounded-lg ${item.stock <= item.stockMin ? 'bg-red-50 text-red-600' : 'bg-slate-100 text-slate-700'}">${item.stock}</span>
                            </div>
                        </div>
                    `;
                }
            });
        }

        cargarInventarioDesdeSheets();
    </script>
</body>
</html>
